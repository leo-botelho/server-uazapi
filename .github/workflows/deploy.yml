name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # Permite redeploy manual pela aba Actions — necessario, por exemplo, quando um
  # secret novo e adicionado e precisa chegar ao Worker sem um commit novo.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:cf
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          UAZAPI_BASE_URL: ${{ secrets.UAZAPI_BASE_URL }}
          UAZAPI_ADMIN_TOKEN: ${{ secrets.UAZAPI_ADMIN_TOKEN }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Cloudflare Worker runtime secrets
        run: |
          printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "${{ secrets.UAZAPI_BASE_URL }}" | npx wrangler secret put UAZAPI_BASE_URL
          printf '%s' "${{ secrets.UAZAPI_ADMIN_TOKEN }}" | npx wrangler secret put UAZAPI_ADMIN_TOKEN
          # Usada em runtime para montar o link de reconexao enviado ao cliente.
          # Sem ela o link sai relativo e o cliente recebe uma URL quebrada.
          printf '%s' "${{ secrets.NEXT_PUBLIC_APP_URL }}" | npx wrangler secret put NEXT_PUBLIC_APP_URL
          # Protege POST /api/monitor/tick (monitor ativo).
          printf '%s' "${{ secrets.MONITOR_SECRET }}" | npx wrangler secret put MONITOR_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker dedicado so para o Cron Trigger. O worker principal e gerado
      # pelo OpenNext e exporta apenas `fetch`, entao nao aceita cron; e o
      # agendador do GitHub Actions atrasava horas na pratica.
      - name: Deploy do worker de cron do monitor
        run: npx wrangler deploy --config workers/monitor-cron/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Secret do worker de cron
        run: printf '%s' "${{ secrets.MONITOR_SECRET }}" | npx wrangler secret put MONITOR_SECRET --config workers/monitor-cron/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
